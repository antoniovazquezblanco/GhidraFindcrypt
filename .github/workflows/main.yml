name: Build
on: [ push, pull_request, workflow_dispatch ]
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        ghidra:
          - "11.2"
          - "11.2.1"
          - "11.3"
          - "11.3.1"
          - "11.3.2"
          - "11.4"
          - "11.4.1"
          - "11.4.2"
          - "11.4.3"
          - "12.0"
          - "12.0.1"
          - "12.0.2"
          - "12.0.3"
          - "12.0.4"
          - "12.1"
          - "12.1.2"
          - "12.1.3"
          - "12.1.4"

    steps:
      - name: Clone Repository
        uses: actions/checkout@v7

      - name: Install Ghidra ${{ matrix.ghidra }}
        id: setup-ghidra
        uses: antoniovazquezblanco/setup-ghidra@v2.3.0
        with:
          auth_token: ${{ secrets.GITHUB_TOKEN }}
          version: ${{ matrix.ghidra }}

      - name: Install Java ${{ steps.setup-ghidra.outputs.java_version }}
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: ${{ steps.setup-ghidra.outputs.java_version }}

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v6.4.0

      - name: Test
        id: test
        run: ./gradlew test

      - name: Upload test reports
        if: failure() && steps.test.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: Test_Reports_Ghidra_${{ matrix.ghidra }}
          path: build/reports/tests/

      - name: Build
        run: ./gradlew buildExtension

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: Findcrypt_Ghidra_${{ matrix.ghidra }}
          path: dist/*.zip
          if-no-files-found: error

  release:
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - name: Download binaries
        uses: actions/download-artifact@v8
        with:
          pattern: Findcrypt_Ghidra_*

      - name: Release
        uses: softprops/action-gh-release@v3
        with:
          files: Findcrypt_Ghidra_*/*.zip
